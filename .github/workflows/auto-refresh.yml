name: Manual Low-Rate Cache Refresh

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Refresh
        env:
          JWT_TOKEN: ${{ secrets.JWT_TOKEN }}
          NEWSNOW_REFRESH_URL: ${{ vars.NEWSNOW_REFRESH_URL }}
          REFRESH_DELAY_MS: 8000
        run: npx tsx ./scripts/refresh.ts
